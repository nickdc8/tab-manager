<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tabs</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <header>
    <h1>Tabs</h1>
    <p id="summary">Loading tabs…</p>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
      <input id="search" type="search" placeholder="Search tabs…" aria-label="Search tabs" autocomplete="off" autofocus>
    </label>
  </header>
  <main id="windows" aria-label="Open windows"></main>
  <p id="status" role="status" aria-live="polite"></p>
  <footer>Click a tab to switch to it · Drag to move</footer>
</body>
</html>
